/var/log/passion/*.log {
    daily
    rotate 21
    missingok
    notifempty
    compress
    delaycompress
    dateext
    su deploy www-data
    create 0640 deploy www-data
}

/var/log/nginx/*.log /var/log/supervisor/*.log {
    weekly
    rotate 12
    missingok
    notifempty
    compress
    delaycompress
    dateext
    su root root
}
